name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (harness and engine portability rule)
        run: pnpm exec vitest run
      - name: Engine suite — cross-runtime harness, Node leg
        run: pnpm --filter @tableside/engine test
      - name: App tests (iOS and Android React Native behavior)
        run: pnpm --filter @tableside/mobile test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-report-node
          path: harness-reports/
